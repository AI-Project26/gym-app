<!doctype html>
<!--
  Neel's Gym Log
  A web page is made of three languages working together:
    HTML       = the structure (what's on the page)
    CSS        = the look (colours, fonts, spacing)
    JavaScript = the behaviour (what happens when you tap things)
  Look for the PART 1–4 markers below to find each section.
-->
<html lang="en">
<head>
<!-- ============ PART 1: HEAD — information about the page (title, fonts, phone settings) ============ -->
<meta charset="utf-8">
<!-- Make it behave like an app on iPhone -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F4">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neel's Gym Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<!-- ============ PART 2: CSS — how everything looks (colours, sizes, layout) ============ -->
<style>
/* Layout: one phone-width column, bottom tab bar; each workout day wears its bumper-plate colour (A blue, B yellow, C red, Core green). */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#E3E8ED; --line:#D3DAE1;
  --fg:#16202A; --muted:#5D6B78; --faint:#8995A1;
  --pA:#2160C4; --pB:#B88A00; --pC:#C7362B; --pD:#238851;
  --good:#1F8A4C; --warn:#B26A00; --bad:#C0392B;
  --g:var(--pA);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1419; --surface:#182029; --sunk:#111820; --line:#263240;
  --fg:#E7ECF1; --muted:#9AA8B5; --faint:#6E7C89;
  --pA:#5B93F0; --pB:#E9B933; --pC:#F06A5D; --pD:#45BE7C;
  --good:#45BE7C; --warn:#E9A23B; --bad:#F06A5D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#182029; --sunk:#111820; --line:#263240;
  --fg:#E7ECF1; --muted:#9AA8B5; --faint:#6E7C89;
  --pA:#5B93F0; --pB:#E9B933; --pC:#F06A5D; --pD:#45BE7C;
  --good:#45BE7C; --warn:#E9A23B; --bad:#F06A5D; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.05}
h2{font-size:22px}
h3{font-size:19px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.wrapr{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.sec{margin:26px 0 10px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.status{font-size:13px;color:var(--faint);text-align:right}

.plates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.plate{border:0;border-radius:var(--r);padding:10px 6px 9px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.plate b{font-family:var(--display);font-size:24px;line-height:1;color:var(--pc)}
.plate span{font-size:12px;color:var(--muted);line-height:1.2}
.plate[aria-pressed="true"]{background:var(--pc);box-shadow:none}
.plate[aria-pressed="true"] b,.plate[aria-pressed="true"] span{color:var(--on,#fff)}
.plate i{position:absolute;top:5px;right:6px;font-style:normal;font-size:11px;font-weight:700;background:var(--good);color:#fff;border-radius:99px;padding:0 5px;line-height:16px}
.gA{--pc:var(--pA)} .gB{--pc:var(--pB);--on:#1A1400} .gC{--pc:var(--pC)} .gD{--pc:var(--pD)}

.card{background:var(--surface);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.item{border-top:1px solid var(--line);position:relative}
.item:first-child{border-top:0}
.item.ready::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--good)}
.ihead{width:100%;border:0;background:none;text-align:left;padding:13px 14px;display:flex;gap:12px;align-items:center}
.ihead .name{font-weight:600;font-size:17px;line-height:1.25}
.ihead .last{font-size:14px;color:var(--muted);margin-top:2px}
.tick{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line);color:transparent;font-size:15px;font-weight:700}
.tick.on{background:var(--g);box-shadow:none;color:var(--gon,#fff)}
.tick.part{box-shadow:inset 0 0 0 2px var(--g);color:var(--g);font-size:11px;font-family:var(--display);letter-spacing:-.02em}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.up{background:var(--good);color:#fff}
.chip.beat{background:color-mix(in srgb,var(--g) 14%,transparent);color:var(--g)}
.chip.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chev{color:var(--faint);flex:none;transition:transform .15s}
.item.open .chev,.idea.open .chev{transform:rotate(90deg)}
.idea{background:var(--surface);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.idea .name{font-weight:600;font-size:17px;line-height:1.25}
.idea .ihead .dot{align-self:flex-start;margin-top:8px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.tipsbox{padding:4px 14px 12px}
.tipsbox summary{color:var(--fg)}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.linkbtn{border:0;background:none;color:var(--g);font-weight:600;font-size:14px;padding:2px 0;text-align:left}
.banner{border-radius:12px;padding:11px 14px;margin-bottom:14px;background:color-mix(in srgb,var(--good) 12%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--good) 35%,transparent)}
.banner b{color:var(--good)}

.panel{padding:4px 14px 16px;display:flex;flex-direction:column;gap:12px}
.lastbox{background:var(--sunk);border-radius:8px;padding:9px 11px;font-size:14px}
.lastbox .note{color:var(--muted);font-style:italic}
.setup{display:flex;gap:8px;align-items:center;font-size:14px;background:color-mix(in srgb,var(--g) 9%,transparent);border-radius:8px;padding:7px 8px 7px 11px}
.setup b{font-weight:600}
.sets{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 28px;gap:8px 6px;align-items:center}
.sets.one{grid-template-columns:20px minmax(0,1fr) 28px}
.sets .h{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-family:var(--display);font-weight:600;text-align:center}
.sets .n{font-family:var(--display);font-weight:700;font-size:18px;color:var(--faint);text-align:center}
.step{display:flex;align-items:stretch;background:var(--bg);border-radius:9px;box-shadow:inset 0 0 0 1px var(--line);min-width:0;height:46px}
.step:focus-within{box-shadow:inset 0 0 0 2px var(--g)}
.step input{border:0;background:none;color:var(--fg);font:600 19px/1 var(--body);font-variant-numeric:tabular-nums;width:100%;min-width:0;text-align:center;padding:0 2px}
.step input::placeholder{color:var(--faint);font-weight:500}
.step input:focus{outline:none}
.sb{border:0;background:none;width:38px;flex:none;font-size:22px;font-weight:500;color:var(--g);border-radius:9px;touch-action:manipulation}
.sb:active{background:color-mix(in srgb,var(--g) 15%,transparent)}
.iconbtn{border:0;background:none;width:30px;height:32px;border-radius:8px;color:var(--faint);font-size:18px;line-height:1;flex:none}
.iconbtn:hover{background:var(--sunk);color:var(--fg)}
textarea,.input,select{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:0;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line);padding:9px 10px}
textarea{resize:vertical;min-height:40px}
.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:600;background:var(--sunk);color:var(--fg)}
.btn.primary{background:var(--g);color:var(--gon,#fff)}
.btn.ghost{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.btn.small{padding:6px 11px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn.dangerfill{background:var(--bad);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cue{font-size:14px;color:var(--muted)}
.target{border-radius:9px;padding:9px 12px;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--g) 45%,transparent);display:flex;flex-direction:column;gap:3px}
.tset b{font-family:var(--display);font-size:24px;font-weight:700;color:var(--g)}
.tset i{color:var(--faint);font-style:normal;margin:0 5px}

.restbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.restbar>div{pointer-events:auto;background:var(--fg);color:var(--bg);border-radius:99px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.restbar b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;min-width:52px}
.restbar button{border:0;border-radius:99px;padding:6px 12px;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:600;font-size:14px}
.restbar.done>div{background:var(--good);color:#fff}
.restbar.done button{color:#fff}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs>div{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--faint);min-height:56px}
nav.tabs button[aria-current="page"]{color:var(--g)}
nav.tabs svg{width:22px;height:22px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--surface);border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.25;display:block}
.stat .vs{font-size:12.5px;font-weight:600;margin-top:2px}
.pos{color:var(--good)} .neg{color:var(--bad)} .flat{color:var(--faint)}
.prow{width:100%;border:0;background:none;text-align:left;padding:11px 14px;display:grid;grid-template-columns:1fr 92px 58px;gap:10px;align-items:center}
.prow .name{font-weight:600;line-height:1.25}
.prow .sub{font-size:13px;color:var(--muted)}
.delta{font-family:var(--display);font-weight:700;font-size:17px;text-align:right;font-variant-numeric:tabular-nums}
.spark{width:92px;height:30px;display:block}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:7px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chartbox{background:var(--surface);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);padding:12px 8px 6px 4px}
.chartbox svg{display:block;width:100%}
.tablewrap{overflow-x:auto;background:var(--surface);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:var(--muted);border-top:0}
td.r,th.r{text-align:right}
td.acts{white-space:nowrap;text-align:right;padding:4px 4px}
tr.editing td{background:color-mix(in srgb,var(--g) 6%,transparent)}
.pr{color:var(--good);font-weight:700;font-size:12px}
.back{border:0;background:none;color:var(--g);font-weight:600;padding:4px 0}
.periodnav{display:flex;align-items:center;gap:6px}
.periodnav b{font-family:var(--display);font-size:19px;font-weight:600;min-width:0;text-align:center}

.day{background:var(--surface);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);padding:12px 14px}
.day ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.day li button{width:100%;border:0;background:none;text-align:left;display:flex;gap:10px;align-items:baseline;font-size:15px;padding:5px 4px;border-radius:7px}
.day li button:hover{background:var(--sunk)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pc);flex:none;transform:translateY(-1px)}
.empty{background:var(--surface);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);padding:22px 18px;text-align:center;color:var(--muted)}

.pitem{padding:11px 14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pitem select{width:auto;padding:6px 8px;font-size:14px}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.tag.sug{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.form .full{grid-column:1/-1}
details>summary{cursor:pointer;font-weight:600;color:var(--muted);padding:6px 0}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:20;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<!-- ============ PART 3: HTML — the structure of the page ============ -->
<div class="wrap" id="app">
  <div class="top"><div><div class="eyebrow" id="today"></div><h1>Gym Log</h1></div><div class="status" id="status">Connecting…</div></div>
  <div class="empty">Loading your exercises and history…</div>
</div>
<div class="restbar" id="rest" hidden></div>
<nav class="tabs" aria-label="Sections"><div id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>

<script src="storage.js"></script>
<script src="starter.js"></script>
<!-- ============ PART 4: JAVASCRIPT — how the app behaves (saving, maths, buttons) ============ -->
<script>
(function(){
const GROUPS={A:"Back & Biceps",B:"Legs",C:"Shoulders, Chest & Triceps",D:"Core & Mobility"};
const SHORT={A:"Back · Biceps",B:"Legs",C:"Shoulders · Arms",D:"Core"};
const GNAME=g=>g==="D"?"Core":"Workout "+g;
const S={exercises:[],hist:{},loadedEx:false,loadedHist:false,db:null,readOnly:false,
  tab:"log",group:pref("gym.group","A"),open:null,rows:{},notes:{},suEdit:null,
  pex:null,metric:"main",edit:null,confirm:null,
  sumMode:pref("gym.sum","week"),sumOff:0,pedit:null,libq:"",
  clr:{from:"",to:"",ex:"all"},ideaArea:"all",ideaOpen:null,ideaFor:null,meta:{},restore:null};
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{if(n==null||n===""||isNaN(n))return"";return(Math.round(n*100)/100).toString()};
const kfmt=n=>n>=10000?(Math.round(n/100)/10)+"k":Math.round(n).toLocaleString("en-GB");
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayISO=()=>iso(new Date());
const parseISO=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const niceDate=s=>parseISO(s).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const longDate=s=>parseISO(s).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
function pref(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}
function remember(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function loadDrafts(){try{const d=JSON.parse(localStorage.getItem("gym.drafts")||"{}");S.rows=d.rows||{};S.notes=d.notes||{}}catch(e){}}
function saveDrafts(){try{localStorage.setItem("gym.drafts",JSON.stringify({rows:S.rows,notes:S.notes}))}catch(e){}}
function setG(g){const r=document.documentElement.style;r.setProperty("--g",`var(--p${g})`);r.setProperty("--gon",g==="B"?"#1A1400":"#fff")}
loadDrafts();setG(S.group);

/* ---------- maths ---------- */
const exById=id=>S.exercises.find(e=>e.id===id);
const entries=id=>(S.hist[id]||[]).slice().sort((a,b)=>a.s-b.s);
const e1rm=(w,r)=>r<=0?0:w*(1+r/30);
function metricsFor(ex,en){
  const sets=en.sets||[];
  if(ex.kind==="weight"){let best=0,top=0,vol=0;for(const [w,r] of sets){best=Math.max(best,e1rm(w,r));top=Math.max(top,w);vol+=w*r}return{main:best,top,vol}}
  let best=0,tot=0;for(const [,r] of sets){best=Math.max(best,r);tot+=r}
  return{main:best,top:best,vol:tot};
}
const METRICS={weight:[["main","Est. 1-rep max","kg"],["top","Heaviest set","kg"],["vol","Volume","kg"]],
  reps:[["main","Best set","reps"],["vol","Total reps","reps"]],
  time:[["main","Longest hold","s"],["vol","Total time","s"]]};
function mainWeight(sets){
  const c={};for(const [w] of sets)c[w]=(c[w]||0)+1;
  let mw=null,mc=0;for(const k in c){const w=+k;if(c[k]>mc||(c[k]===mc&&w>mw)){mw=w;mc=c[k]}}
  return mw;
}
const MAXSTEP=10;
const stepOf=ex=>(ex.inc>0&&ex.inc<=MAXSTEP)?ex.inc:2.5;
const needOf=ex=>ex.sets||3;
const isDone=(ex,e)=>!!e&&e.sets.length>=needOf(ex);
/* the session recommendations are based on: today's entry only counts once every set is logged */
const baseEntries=ex=>{const t=todayISO();return entries(ex.id).filter(e=>!(e.d===t&&!isDone(ex,e)))};
function suggest(ex){
  const en=baseEntries(ex);const last=en[en.length-1];const need=needOf(ex);
  if(!last)return ex.kind==="weight"&&ex.startW>0?{text:`Start at ${fmt(ex.startW)} kg`,cls:"",w:ex.startW}:{text:`Start: ${need} × ${ex.lo}–${ex.hi}`,cls:"",w:null};
  const st=stepOf(ex);
  if(ex.kind==="time"){const r=last.sets.map(s=>s[1]);return{text:`Beat ${Math.max(...r)}s`,cls:"beat",w:0}}
  const weighted=ex.kind==="weight";
  const mw=weighted?mainWeight(last.sets):0;
  const reps=(weighted?last.sets.filter(s=>s[0]===mw):last.sets).map(s=>s[1]);
  const top=reps.slice(0,need);
  // ready to move up: every working set at the top of the range
  if(top.length>=need&&Math.min(...top)>=ex.hi){
    if(!weighted)return{text:"↑ Add weight or a set",cls:"up",w:0,up:true,why:`You hit ${ex.hi}+ on every set. Hold a dumbbell or add a set to keep progressing.`};
    if(ex.inc>0){const w=mw+st;const t=repsAt(last.sets,mw,w,ex,need);
      return{text:`↑ Move up to ${fmt(w)} kg`,cls:"up",w,from:mw,up:true,targets:t,why:`At ${fmt(w)} kg your est. 1-rep max says about ${t[0]} reps on the first set. Build back up to ${ex.hi} on every set, then move up again.`}}
  }
  // too heavy: everything under the range
  if(weighted&&Math.max(...reps)<ex.lo&&ex.inc>0&&mw-st>0){const w=mw-st;const t=repsAt(last.sets,mw,w,ex,need);
    return{text:`Under ${ex.lo} reps: try ${fmt(w)} kg`,cls:"warn",w,targets:t,why:`Every set was under ${ex.lo} reps. Dropping to ${fmt(w)} kg should get you about ${t.join("·")}, inside your ${ex.lo}–${ex.hi} range.`}}
  const t=spreadTargets(reps,need,ex);
  const at=weighted?` at ${fmt(mw)}`:"";
  const drop=Math.max(...top)-Math.min(...top);
  const tot=top.reduce((a,b)=>a+b,0);
  let why;
  if(top.length<need)why=`Last time you did ${top.length} set${top.length>1?"s":""}. Aim for all ${need} today.`;
  else if(t.every(x=>x>=ex.hi))why=`Hit ${ex.hi} on every set and you'll move up next time.`;
  else if(drop>=3||Math.max(...top)>ex.hi)why=`Last time ${top.join("·")} dropped by ${drop} reps across sets${Math.max(...top)>ex.hi?` and set 1 went past ${ex.hi}`:""}. Spreading ${t.reduce((a,b)=>a+b,0)} reps evenly (one more than your ${tot}) keeps every set in your ${ex.lo}–${ex.hi} range. Stop set 1 with a rep or two left in the tank, and rest about 2 minutes between sets.`;
  else why=`One more rep than last time (${tot} → ${t.reduce((a,b)=>a+b,0)}), added to your weakest set.`;
  return{text:`Aim ${t.join("·")}${at}`,cls:"beat",w:weighted?mw:0,targets:t,why};
}
/* even, front-loaded spread of (last total + 1) across the target sets, capped at the top of the range */
function spreadTargets(reps,need,ex){
  const done=reps.slice(0,need);const avg=done.reduce((a,b)=>a+b,0)/done.length;
  let total=Math.round(done.reduce((a,b)=>a+b,0)+avg*Math.max(0,need-done.length))+1;
  total=Math.min(total,need*ex.hi);
  const base=Math.floor(total/need),extra=total-base*need;
  return Array.from({length:need},(_,i)=>base+(i<extra?1:0));
}
/* expected reps at a new weight, from the best set's est. 1-rep max, with a one-rep fade on the last set */
function repsAt(sets,mw,w,ex,need){
  const best=Math.max(...sets.filter(s=>s[0]===mw).map(([a,r])=>e1rm(a,r)));
  let r=Math.round(30*(best/w-1));r=Math.max(ex.lo>1?ex.lo-1:1,Math.min(ex.hi,r));
  return Array.from({length:need},(_,i)=>i===need-1&&need>1&&r>ex.lo?r-1:r);
}
function setsText(ex,sets){
  if(!sets||!sets.length)return"";
  if(ex.kind==="time")return sets.map(s=>s[1]+"s").join(" · ");
  if(ex.kind==="reps"){const w=sets.some(s=>s[0]>0);return sets.map(s=>(w&&s[0]?`+${fmt(s[0])}×`:"")+s[1]).join(" · ")+" reps"}
  const parts=[];let cur=null;
  for(const [w,r] of sets){if(!cur||cur.w!==w){cur={w,r:[]};parts.push(cur)}cur.r.push(r)}
  return parts.map(p=>`${fmt(p.w)} × ${p.r.join(" · ")}`).join("  →  ");
}
const entryLabel=e=>e.d?niceDate(e.d):`Imported #${e.s}`;
function prFlags(ex){
  const en=entries(ex.id);const flags={};let best=0;
  for(const e of en){const m=metricsFor(ex,e).main;if(best>0&&m>best+1e-9)flags[e.id]=true;best=Math.max(best,m)}
  return flags;
}

async function removeEntries(pred){

    const list=S.hist[id]||[];const keep=list.filter(e=>!pred(e,id));

}

function setsGrid(ex,rows,ctx,prevReps){

function stepper(ctx,i,k,val,ph,label){
  return `<div class="step"><button type="button" class="sb" data-act="step" data-ctx="${ctx}" data-i="${i}" data-k="${k}" data-d="-1" aria-label="Decrease ${label}">−</button><input id="${k}-${ctx}-${i}" inputmode="${k==="w"?"decimal":"numeric"}" data-in="${k}" data-ctx="${ctx}" data-i="${i}" value="${esc(val)}" placeholder="${esc(ph)}" aria-label="${label}"><button type="button" class="sb" data-act="step" data-ctx="${ctx}" data-i="${i}" data-k="${k}" data-d="1" aria-label="Increase ${label}">+</button></div>`;

function readSets(ex,rows){
  const sets=[];
  for(const r of rows){

    sets.push([w,reps]);

}

/* ---------- PROGRESS ---------- */
function periodRange(mode,off){
  const now=new Date();let s,e;
  if(mode==="week"){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());const dow=(d.getDay()+6)%7;s=new Date(d);s.setDate(d.getDate()-dow+off*7);e=new Date(s);e.setDate(s.getDate()+7)}
  else{s=new Date(now.getFullYear(),now.getMonth()+off,1);e=new Date(now.getFullYear(),now.getMonth()+off+1,1)}
  return{s:iso(s),e:iso(e),sd:s,ed:e};
}
function periodLabel(mode,off,r){
  if(mode==="week"){if(off===0)return"This week";if(off===-1)return"Last week";const end=new Date(r.ed);end.setDate(end.getDate()-1);return`${r.sd.getDate()} ${r.sd.toLocaleDateString("en-GB",{month:"short"})} – ${end.getDate()} ${end.toLocaleDateString("en-GB",{month:"short"})}`}
  return off===0?"This month":r.sd.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
}
function periodStats(r){
  const days=new Set();let sets=0,vol=0,prs=0;const improved=[];
  for(const ex of S.exercises){
    const en=entries(ex.id);const fl=prFlags(ex);
    const inP=en.filter(e=>e.d&&e.d>=r.s&&e.d<r.e);if(!inP.length)continue;
    const before=en.filter(e=>!e.d||e.d<r.s);
    for(const e of inP){days.add(e.d);sets+=e.sets.length;if(ex.kind==="weight")vol+=metricsFor(ex,e).vol;if(fl[e.id])prs++}
    const bi=Math.max(...inP.map(e=>metricsFor(ex,e).main));const bb=before.length?Math.max(...before.map(e=>metricsFor(ex,e).main)):0;
    if(bb>0)improved.push({ex,d:(bi-bb)/bb,bi,bb});
  }
  return{days:days.size,sets,vol,prs,improved};
}
function vsText(cur,prev,unit){
  if(!prev&&!cur)return`<div class="vs flat">–</div>`;
  if(!prev)return`<div class="vs pos">new</div>`;
  const d=cur-prev;if(d===0)return`<div class="vs flat">same as before</div>`;
  return `<div class="vs ${d>0?"pos":"neg"}">${d>0?"▲":"▼"} ${unit==="%"?Math.abs(Math.round(d/prev*100))+"%":Math.abs(d)} vs previous</div>`;
}
function viewSummary(){
  const m=S.sumMode,o=S.sumOff;const r=periodRange(m,o),rp=periodRange(m,o-1);
  const a=periodStats(r),b=periodStats(rp);
  const anyDated=S.exercises.some(ex=>(S.hist[ex.id]||[]).some(e=>e.d));
  let h=`<div class="row between wrapr" style="margin-bottom:10px"><div class="seg" role="group" aria-label="Summary period"><button data-act="summode" data-v="week" aria-pressed="${m==="week"}">Weekly</button><button data-act="summode" data-v="month" aria-pressed="${m==="month"}">Monthly</button></div>
    <div class="periodnav"><button class="iconbtn" data-act="sumoff" data-d="-1" aria-label="Previous">‹</button><b>${esc(periodLabel(m,o,r))}</b><button class="iconbtn" data-act="sumoff" data-d="1" aria-label="Next" ${o>=0?"disabled":""}>›</button></div></div>`;
  if(!anyDated)return h+`<div class="empty small" style="margin-bottom:8px">Your weekly and monthly summaries start with the first session you log in the app. Imported history has no dates, so it shows under each exercise below.</div>`;
  h+=`<div class="stats" style="margin-bottom:10px">
    <div class="stat"><b>${a.days}</b><span>gym days</span>${vsText(a.days,b.days)}</div>
    <div class="stat"><b>${a.sets}</b><span>sets done</span>${vsText(a.sets,b.sets)}</div>

function bars(m,o){

function deltaOf(ex){

const TRASH='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-2px"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>';

function drawChart(){
  const ex=exById(S.pex);const box=$("#chart");if(!ex||!box)return;
  const en=entries(ex.id);const vals=en.map(e=>metricsFor(ex,e)[S.metric]);
  const W=Math.max(280,box.clientWidth||320),H=230,pl=44,pr=12,pt=12,pb=30;
  if(!vals.length){box.innerHTML="";return}
  let mn=Math.min(...vals),mx=Math.max(...vals);if(mn===mx){mn-=1;mx+=1}
  const raw=(mx-mn)/4;const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw);
  const lo=Math.floor(mn/step)*step,hi=Math.ceil(mx/step)*step;
  const x=i=>pl+(vals.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(vals.length-1));
  const y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(ex.name)} progress chart">`;
  for(let v=lo;v<=hi+1e-9;v+=step)s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-7}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--faint)" font-family="Barlow,system-ui">${fmt(v)}</text>`;
  const ticks=Math.min(vals.length,6);
  for(let k=0;k<ticks;k++){const i=ticks===1?0:Math.round(k*(vals.length-1)/(ticks-1));const e=en[i];
    const lab=e.d?niceDate(e.d).replace(/^\w+ /,""):"#"+e.s;
    s+=`<text x="${x(i)}" y="${H-10}" text-anchor="${k===0?"start":k===ticks-1?"end":"middle"}" font-size="11" fill="var(--faint)" font-family="Barlow,system-ui">${esc(lab)}</text>`}
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  s+=`<polygon points="${x(0)},${H-pb} ${pts.join(" ")} ${x(vals.length-1)},${H-pb}" fill="var(--g)" fill-opacity=".12"/>`;
  s+=`<polyline points="${pts.join(" ")}" fill="none" stroke="var(--g)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;

    s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${hr}" fill="transparent" style="cursor:pointer" data-act="pt" data-v="${en[i].id}" role="button" aria-label="${esc(entryLabel(en[i]))}, edit or delete"><title>${esc(entryLabel(en[i]))}: ${fmt(Math.round(v*10)/10)}</title></circle>`});
  const li=vals.length-1;
  s+=`<text x="${Math.min(x(li),W-pr)}" y="${Math.max(y(vals[li])-10,pt+10)}" text-anchor="end" font-size="13" font-weight="600" fill="var(--fg)" font-family="Barlow,system-ui">${fmt(Math.round(vals[li]*10)/10)}</text>`;
  box.innerHTML=s+`</svg>`;
}

/* ---------- HISTORY ---------- */
function viewHistory(){
  const days={};
  for(const ex of S.exercises)for(const e of (S.hist[ex.id]||[]))if(e.d)(days[e.d]=days[e.d]||[]).push({ex,e});
  const keys=Object.keys(days).sort().reverse();
  const impTotal=countEntries(e=>!e.d);
  let h=header("Every gym day you've logged","History");
  if(!keys.length)h+=`<div class="empty">Sessions you log from now on appear here by date. Tap any exercise in a day to correct it.</div>`;
  else h+=`<div class="stack">${keys.map(k=>{const items=days[k].sort((a,b)=>a.e.s-b.e.s);const gs=[...new Set(items.map(i=>i.ex.group))];
    return `<div class="day"><div class="row between wrapr"><div><h3>${niceDate(k)}</h3><div class="muted small">${gs.map(g=>GROUPS[g]).join(" + ")}</div></div>${confirmBtn("day:"+k,"Delete day","Tap to confirm",`data-v="${k}"`)}</div><ul>${items.map(({ex,e})=>`<li class="g${ex.group}"><button data-act="goedit" data-ex="${ex.id}" data-v="${e.id}"><span class="dot"></span><span class="grow"><b style="font-weight:600">${esc(ex.name)}</b><br><span class="muted num small">${esc(setsText(ex,e.sets))}${e.n?" · "+esc(e.n):""}</span></span><span class="muted">✎</span></button></li>`).join("")}</ul></div>`}).join("")}</div>`;

  h+=backupSection();
  h+=`<h2 class="sec">Clear history</h2><div class="card stack" style="padding:14px">`;
  h+=`<div><div style="font-weight:600">By date range</div><div class="muted small">Removes every exercise logged between these dates, inclusive.</div></div>
    <div class="row wrapr"><label class="small muted grow" style="display:flex;flex-direction:column;gap:4px">From<input type="date" class="input" id="clr-from" data-clr="from" value="${esc(S.clr.from)}" max="${todayISO()}"></label><label class="small muted grow" style="display:flex;flex-direction:column;gap:4px">To<input type="date" class="input" id="clr-to" data-clr="to" value="${esc(S.clr.to)}" max="${todayISO()}"></label></div>`;
  const f=S.clr.from,t=S.clr.to||S.clr.from;
  if(f){const n=countEntries(e=>e.d&&e.d>=f&&e.d<=t);const nd=new Set();for(const id in S.hist)for(const e of S.hist[id])if(e.d&&e.d>=f&&e.d<=t)nd.add(e.d);
    h+=n?`<div class="btns"><span class="small grow">${n} entr${n===1?"y":"ies"} on ${nd.size} day${nd.size===1?"":"s"}</span>${confirmBtn("range","Delete these","Tap to confirm",'',"btn small dangerfill")}</div>`:`<div class="small muted">Nothing logged in that range.</div>`}
  h+=`<hr style="border:0;border-top:1px solid var(--line);margin:4px 0;width:100%">`;
  h+=`<div><div style="font-weight:600">Imported history</div><div class="muted small">The ${impTotal} undated sessions brought in from your Word document.</div></div>`;
  if(impTotal){
    const exs=S.exercises.filter(e=>(S.hist[e.id]||[]).some(x=>!x.d));
    h+=`<select id="clr-ex" data-clr="ex"><option value="all">All exercises (${impTotal})</option>${exs.map(e=>`<option value="${e.id}" ${S.clr.ex===e.id?"selected":""}>${esc(e.name)} (${(S.hist[e.id]||[]).filter(x=>!x.d).length})</option>`).join("")}</select>`;
    const n=countEntries((e,id)=>!e.d&&(S.clr.ex==="all"||id===S.clr.ex));
    h+=`<div class="btns"><span class="small grow">To remove single sessions, use ✎ on an exercise's Progress page.</span>${confirmBtn("imported",`Delete ${n} imported`,"Tap to confirm",'',"btn small dangerfill")}</div>`;
  }else h+=`<div class="small muted">All imported history has been cleared.</div>`;
  h+=`</div>`;
  return h;

function readForm(p){
  const lo=parseInt($(`#${p}-lo`).value)||6;
  return{name:$(`#${p}-name`).value.trim(),group:$(`#${p}-group`).value,kind:$(`#${p}-kind`).value,lo,hi:Math.max(lo,parseInt($(`#${p}-hi`).value)||lo),
    sets:Math.max(1,parseInt($(`#${p}-sets`).value)||3),inc:Math.max(0,parseFloat(String($(`#${p}-inc`).value).replace(",","."))||0),startW:parseFloat(String($(`#${p}-startw`).value).replace(",","."))||null,setup:$(`#${p}-setup`).value.trim(),cue:$(`#${p}-cue`).value.trim()};
}
function formError(d){
  if(!d.name)return"Give the exercise a name";
  if(d.kind==="weight"&&d.inc>MAXSTEP)return`The increase is ${fmt(d.inc)} kg, which is too big for one step. Use the small jump to the next weight (e.g. 2.5) and put ${fmt(d.inc)} in Current working weight.`;
  return null;
}
function viewPlan(){
  let h=header(`Targets ${"6–10"} reps unless you change them`,"Plan");
  for(const g of Object.keys(GROUPS)){
    const list=S.exercises.filter(e=>e.group===g&&e.active).sort((a,b)=>a.order-b.order);
    h+=`<div class="row" style="margin:14px 0 8px"><span class="dot g${g}"></span><h3>${GNAME(g)} · ${GROUPS[g]}</h3></div><div class="list">`;
    h+=list.length?list.map((ex,i)=>S.pedit===ex.id?`<div class="item">${exForm(ex,false)}</div>`:`<div class="item pitem"><span class="grow" style="min-width:140px"><div style="font-weight:600">${esc(ex.name)}</div><div class="muted small">${ex.sets||3} × ${ex.kind==="time"?`${ex.lo}–${ex.hi}s`:`${ex.lo}–${ex.hi} reps`}${ex.kind==="weight"&&ex.inc?` · +${fmt(ex.inc)} kg`:""}${ex.setup?" · "+esc(ex.setup):""}</div></span>
      <button class="iconbtn" data-act="move" data-v="${ex.id}" data-d="-1" aria-label="Move up" ${i===0?"disabled":""}>↑</button>
      <button class="iconbtn" data-act="move" data-v="${ex.id}" data-d="1" aria-label="Move down" ${i===list.length-1?"disabled":""}>↓</button>
      <button class="iconbtn" data-act="pedit" data-v="${ex.id}" aria-label="Edit ${esc(ex.name)}">✎</button>
      <button class="btn small ghost" data-act="retire" data-v="${ex.id}">Remove</button></div>`).join(""):`<div class="pitem muted small">Nothing here yet. Add one from All exercises below.</div>`;
    h+=`</div>`;
  }
  const lib=S.exercises.filter(e=>!e.active).sort((a,b)=>(b.suggested?1:0)-(a.suggested?1:0)||a.name.localeCompare(b.name));
  h+=`<h2 class="sec">All exercises</h2><p class="muted small" style="margin:-4px 0 10px">Everything not in your plan: ones you've removed, your own, and suggestions to fill gaps. Your history is kept when you remove an exercise.</p>`;
  h+=`<input class="input" id="libq" data-lib="1" placeholder="Search exercises" value="${esc(S.libq)}" style="margin-bottom:8px">`;
  h+=lib.length?`<div class="list" id="lib">${lib.map(e=>{const n=(S.hist[e.id]||[]).length;
    return S.pedit===e.id?`<div class="item">${exForm(e,false)}</div>`:`<div class="item pitem g${e.group}" data-name="${esc(e.name.toLowerCase())}"><span class="grow" style="min-width:160px"><div class="row" style="gap:6px;flex-wrap:wrap"><b style="font-weight:600">${esc(e.name)}</b>${e.suggested?'<span class="tag sug">Suggested</span>':n?`<span class="tag">${n} sessions</span>`:""}</div><div class="muted small">${e.suggested?esc(e.why):`${GROUPS[e.group]}${e.note?" · "+esc(e.note):""}`}</div></span>
      <button class="iconbtn" data-act="pedit" data-v="${e.id}" aria-label="Edit">✎</button>
      <select data-addg="${e.id}" aria-label="Workout to add ${esc(e.name)} to">${Object.keys(GROUPS).map(g=>`<option value="${g}" ${g===e.group?"selected":""}>${g==="D"?"Core":g}</option>`).join("")}</select>
      <button class="btn small primary" data-act="adopt" data-v="${e.id}">Add</button></div>`}).join("")}</div>`:`<div class="empty small">Every exercise is in your plan.</div>`;
  h+=`<h2 class="sec">New exercise</h2><div class="card">${exForm({group:S.group,kind:"weight",lo:6,hi:10,sets:3,inc:2.5},true)}</div>`;
  return h;
}

    h+=`<div class="small"><b>Common mistake:</b> ${esc(i.mistakes)}</div><div class="small muted">Start with 3 sets × ${i.kind==="time"?`${i.lo}–${i.hi} seconds`:`${i.lo}–${i.hi} reps`}${i.kind==="weight"?", light enough to get the form right first":""}.</div>`;
    if(st==="plan")h+=`<div class="small muted">Already in ${GNAME(exById(i.id).group)}.</div>`;
    else h+=`<div class="btns">${rep?`<button class="btn small primary" data-act="ideaswap" data-v="${i.id}" data-ex="${rep.id}">Swap for ${esc(rep.name)}</button>`:""}<select data-ideag="${i.id}" style="width:auto" aria-label="Workout">${Object.keys(GROUPS).map(x=>`<option value="${x}" ${x===g?"selected":""}>${GNAME(x)}</option>`).join("")}</select><button class="btn small ${rep?"ghost":"primary"}" data-act="ideaadd" data-v="${i.id}">Add${rep?" as well":" to plan"}</button></div>`;
    h+=`</div>`;
  }
  return h+`</div>`;
}
async function addIdea(id,g,replace){
  const i=IDEAS.find(x=>x.id===id);const ex=exById(id);
  const maxO=Math.max(0,...S.exercises.map(e=>e.order));
  let order=maxO+1,list=S.exercises.slice();
  if(replace){const r=exById(replace);order=r.order;list=list.map(e=>e.id===replace?{...e,active:false,order:maxO+2}:e)}
  const base={name:i.name,group:g,kind:i.kind,lo:i.lo,hi:i.hi,sets:3,inc:i.inc,cue:i.cues.join(". "),active:true,suggested:false,order};
  list=ex?list.map(e=>e.id===id?{...e,...base}:e):[...list,{id,...base,setup:"",note:""}];
  await writeExercises(list);
}


/* ---------- BACKUP & RESTORE ---------- */
const BACKUP_DAYS=14;
const daysSince=t=>t?Math.floor((Date.now()-new Date(t).getTime())/86400000):null;
function backupDue(){
  const last=S.meta.lastBackup;
  const newer=S.exercises.some(ex=>(S.hist[ex.id]||[]).some(e=>e.d&&(!last||e.s>new Date(last).getTime())));
  if(!newer)return null;
  const d=daysSince(last);
  return d==null||d>=BACKUP_DAYS?{d}:null;
}
function backupData(){
  const n=Object.values(S.hist).reduce((a,l)=>a+l.length,0);
  return{app:"neels-gym-log",format:1,exportedAt:new Date().toISOString(),counts:{exercises:S.exercises.length,sessions:n},exercises:S.exercises,history:S.hist};
}
async function markBackedUp(){
  const t=new Date().toISOString();S.meta={...S.meta,lastBackup:t};render();
  await queued("meta",()=>S.db.doc("config/meta").set({...S.meta,lastBackup:t}));
}
async function doBackup(){
  const json=JSON.stringify(backupData(),null,1);
  const filename=`gym-log-backup-${todayISO()}.json`;
  const dl=window.localDownloads;
  if(!dl){toast("Saving files isn't available here. Open the app in Claude to back up.");return}
  try{
    await dl.save({filename,data:json});
    await markBackedUp();
    toast("Backup saved. Keep it in iCloud Drive or Files.");
  }catch(e){
    if(e&&e.code==="declined")toast("Backup cancelled");
    else if(e&&e.code==="rate_limited")toast("A save prompt is already open");
    else{toast("Couldn't save the backup here. Try again in a moment.");console.error(e)}
  }
}
function parseBackup(text){
  let d;try{d=JSON.parse(text)}catch(e){return{err:"That file isn't a gym log backup (it couldn't be read as JSON)."}}
  if(!d||!Array.isArray(d.exercises)||typeof d.history!=="object"||!d.history)return{err:"That file isn't a gym log backup. Choose a file named gym-log-backup-….json."};
  const num=x=>typeof x==="number"&&isFinite(x);
  const exercises=d.exercises.filter(e=>e&&typeof e.id==="string"&&/^[A-Za-z0-9_\-.~:@+]{1,120}$/.test(e.id)&&typeof e.name==="string"&&GROUPS[e.group]&&METRICS[e.kind])
    .map(e=>({...e,name:String(e.name).slice(0,80),lo:num(e.lo)?e.lo:6,hi:num(e.hi)?e.hi:10,inc:num(e.inc)?e.inc:2.5,sets:num(e.sets)?e.sets:3,order:num(e.order)?e.order:999,active:!!e.active}));
  const ids=new Set(exercises.map(e=>e.id));const history={};let n=0;
  for(const [id,list] of Object.entries(d.history)){
    if(!ids.has(id)||!Array.isArray(list))continue;
    history[id]=list.filter(x=>x&&typeof x.id==="string"&&num(x.s)&&Array.isArray(x.sets)&&x.sets.every(st=>Array.isArray(st)&&num(st[0])&&num(st[1])))
      .map(x=>({id:x.id,d:typeof x.d==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(x.d)?x.d:null,s:x.s,sets:x.sets.map(st=>[st[0],st[1]]),n:typeof x.n==="string"?x.n.slice(0,500):"",...(x.g?{g:x.g}:{})}));
    n+=history[id].length;
  }
  if(!exercises.length)return{err:"That backup has no exercises in it."};
  return{data:{exercises,history},nEx:exercises.length,nSessions:n,exportedAt:d.exportedAt||null};
}
async function doRestore(){
  const R=S.restore;if(!R)return;
  const ids=new Set([...Object.keys(S.hist),...Object.keys(R.data.history)]);
  await writeExercises(R.data.exercises);
  await Promise.all([...ids].map(id=>writeHistory(id,R.data.history[id]||[])));
  S.restore=null;toast(`Restored ${R.nSessions} sessions across ${R.nEx} exercises`);
}
function backupSection(welcome){
  const last=S.meta.lastBackup;const d=daysSince(last);
  let h=`<h2 class="sec">${welcome?"Already have a backup?":"Back up &amp; restore"}</h2><div class="card stack" style="padding:14px">`;
  if(!welcome)h+=`<div class="row between wrapr"><div class="grow" style="min-width:180px"><div style="font-weight:600">Back up</div><div class="muted small">Saves everything (your plan, setups and all sessions) as one file. Keep it in iCloud Drive or Files.</div><div class="small" style="margin-top:4px">${last?`Last backup: <b>${d===0?"today":d===1?"yesterday":d+" days ago"}</b>`:`<b style="color:var(--warn)">No backup yet</b>`}</div></div><button class="btn primary" data-act="backup">Back up now</button></div>`;
  if(!welcome)h+=`<hr style="border:0;border-top:1px solid var(--line);margin:4px 0;width:100%">`;
  h+=welcome?`<div class="muted small">Load your backup file (for example from iCloud Drive) to bring in your plan and all your sessions.</div>`:`<div><div style="font-weight:600">Restore</div><div class="muted small">Load a backup file. It replaces what's in the app now, so back up first if you're unsure.</div></div>`;
  h+=`<label class="btn ghost" style="align-self:flex-start;cursor:pointer">${welcome?"Restore from a backup…":"Choose backup file…"}<input type="file" id="restore-file" accept=".json,application/json" hidden></label>`;
  if(S.restore){const R=S.restore;
    h+=`<div class="lastbox stack" style="gap:8px"><div><b>${esc(R.name)}</b><br><span class="small">${R.nSessions} sessions across ${R.nEx} exercises${R.exportedAt?` · backed up ${esc(new Date(R.exportedAt).toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}))}`:""}</span></div><div class="btns">${confirmBtn("restore","Replace my data with this backup","Tap again to replace everything",'',"btn small dangerfill")}<button class="btn small ghost" data-act="restorecancel">Cancel</button></div></div>`}
  return h+`</div>`;
}

/* ---------- actions ---------- */
function stepValue(ctx,i,k,d){
  const rows=rowsOf(ctx);if(!rows||!rows[i])return;
  const ex=ctx==="edit"?exById(S.edit.ex):exById(ctx);
  const inp=document.getElementById(`${k}-${ctx}-${i}`);
  let cur=parseFloat(String(rows[i][k]).replace(",","."));
  if(isNaN(cur)){
    if(k==="w"){const above=i>0?parseFloat(rows[i-1].w):NaN;cur=!isNaN(above)?above:(ctx==="edit"?0:(suggest(ex).w||0));if(d>0&&cur>0){rows[i][k]=fmt(cur);inp.value=rows[i][k];saveDrafts();return}}
    else{const ph=inp&&parseFloat(inp.placeholder);cur=!isNaN(ph)?ph:ex.lo;rows[i][k]=String(cur);inp.value=rows[i][k];saveDrafts();return}
  }
  const step=k==="w"?stepOf(ex):(ex.kind==="time"?5:1);
  const v=Math.max(0,Math.round((cur+d*step)*100)/100);
  rows[i][k]=k==="w"?fmt(v):String(Math.round(v));
  if(inp)inp.value=rows[i][k];
  if(ctx!=="edit")saveDrafts();
}
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a!=="confirm"&&a!=="step")S.confirm=null;
  try{
  if(a==="tab"){S.ideaFor=null;S.tab=v;S.open=null;S.edit=null;S.pedit=null;if(v!=="progress")S.pex=null;setG(S.group);render();scrollTo(0,0)}
  else if(a==="group"){S.group=v;S.open=null;remember("gym.group",v);setG(v);render()}
  else if(a==="open"){S.open=S.open===v?null:v;S.suEdit=null;render()}
  else if(a==="step")stepValue(b.dataset.ctx,+b.dataset.i,b.dataset.k,+b.dataset.d);
  else if(a==="addrow"){const rows=rowsOf(b.dataset.ctx);const l=rows[rows.length-1];rows.push({w:l?l.w:"",r:""});if(b.dataset.ctx!=="edit")saveDrafts();render()}
  else if(a==="delrow"){rowsOf(b.dataset.ctx).splice(+b.dataset.i,1);if(b.dataset.ctx!=="edit")saveDrafts();render()}
  else if(a==="copylast"){const ex=exById(v);const en=entries(v).filter(e=>e.d!==todayISO());const p=en[en.length-1];if(p){S.rows[v]=p.sets.map(([w,r])=>({w:ex.kind==="time"?"":fmt(w),r:String(r)}));saveDrafts();render()}}
  else if(a==="save")await saveEx(v);
  else if(a==="suedit"){S.suEdit=v;render();const i=$("#su-"+v);i&&i.focus()}
  else if(a==="susave"){const val=($("#su-"+v)||{}).value||"";S.suEdit=null;await patchExercise(v,{setup:val.trim()});toast("Setup saved")}
  else if(a==="rest")startRest(+v);
  else if(a==="reststop")stopRest();
  else if(a==="restadd"){restEnd+=30000;rang=false;tickRest()}
  else if(a==="pex"){S.pex=v||null;S.edit=null;S.sel=null;S.metric="main";if(!v)setG(S.group);render();scrollTo(0,0)}
  else if(a==="metric"){S.metric=v;render()}
  else if(a==="backup")await doBackup();
  else if(a==="starter"){await writeExercises(window.STARTER_PLAN.map(e=>({...e})));toast("Default plan loaded. Change it any time on the Plan tab.")}
  else if(a==="restorecancel"){S.restore=null;render()}
  else if(a==="ideafor"){S.ideaFor=v||null;S.tab="ideas";S.ideaOpen=null;S.open=null;render();scrollTo(0,0)}
  else if(a==="ideaarea"){S.ideaArea=v;render()}
  else if(a==="ideaopen"){S.ideaOpen=S.ideaOpen===v?null:v;render()}
  else if(a==="ideaadd"){const sel=document.querySelector(`[data-ideag="${v}"]`);const g=sel?sel.value:IDEAS.find(x=>x.id===v).group;await addIdea(v,g,null);toast(`Added to ${GNAME(g)}`)}
  else if(a==="ideaswap"){const r=exById(b.dataset.ex);await addIdea(v,r.group,r.id);toast(`Swapped into ${GNAME(r.group)}. ${r.name} and its history are under Plan → All exercises.`)}
  else if(a==="pt"){S.sel=v&&S.sel!==v?v:null;if(S.edit&&S.edit.id!==S.sel)S.edit=null;render()}
  else if(a==="summode"){S.sumMode=v;S.sumOff=0;remember("gym.sum",v);render()}
  else if(a==="sumoff"){S.sumOff=Math.min(0,S.sumOff+(+b.dataset.d));render()}
  else if(a==="edit"||a==="goedit"){
    const ex=exById(b.dataset.ex);const e=(S.hist[ex.id]||[]).find(x=>x.id===v);if(!e)return;
    if(a==="edit"&&S.edit&&S.edit.id===v){S.edit=null;render();return}
    S.edit={ex:ex.id,id:v,d:e.d||"",n:e.n||"",rows:e.sets.map(([w,r])=>({w:ex.kind==="time"?"":fmt(w),r:String(r)}))};
    if(a==="goedit"){S.tab="progress";S.pex=ex.id;S.metric="main"}
    render();const row=document.getElementById("row-"+v);row&&row.scrollIntoView({block:"start",behavior:"smooth"});
  }
  else if(a==="editcancel"){S.edit=null;render()}
  else if(a==="editsave"){
    const E=S.edit;const ex=exById(E.ex);const r=readSets(ex,E.rows);if(r.err){toast(r.err);return}
    const list=(S.hist[ex.id]||[]).map(e=>e.id===E.id?{...e,sets:r.sets,n:(E.n||"").trim(),d:E.d||null}:e);
    S.edit=null;await writeHistory(ex.id,list);toast("Correction saved");
  }
  else if(a==="confirm"){
    const key=b.dataset.key;
    if(S.confirm!==key){S.confirm=key;render();return}
    S.confirm=null;
    if(key.startsWith("today:")){const id=v,t=todayISO();delete S.rows[id];delete S.notes[id];saveDrafts();await writeHistory(id,(S.hist[id]||[]).filter(e=>e.d!==t));toast("Deleted today's sets")}
    else if(key.startsWith("entry:")){const id=b.dataset.ex;S.edit=null;S.sel=null;await writeHistory(id,(S.hist[id]||[]).filter(e=>e.id!==v));toast("Entry deleted")}
    else if(key.startsWith("day:")){const n=await removeEntries(e=>e.d===v);toast(`Deleted ${n} entr${n===1?"y":"ies"} from ${niceDate(v)}`)}
    else if(key==="range"){const f=S.clr.from,t=S.clr.to||S.clr.from;const n=await removeEntries(e=>e.d&&e.d>=f&&e.d<=t);S.clr.from=S.clr.to="";toast(`Deleted ${n} entr${n===1?"y":"ies"}`)}
    else if(key==="restore"){await doRestore()}
    else if(key==="imported"){const sel=S.clr.ex;const n=await removeEntries((e,id)=>!e.d&&(sel==="all"||id===sel));S.clr.ex="all";toast(`Deleted ${n} imported session${n===1?"":"s"}`)}
  }
  else if(a==="retire"){await patchExercise(v,{active:false});toast("Removed from plan. It's under All exercises if you want it back.")}
  else if(a==="adopt"){const sel=document.querySelector(`[data-addg="${v}"]`);const g=sel?sel.value:exById(v).group;
    const order=Math.max(0,...S.exercises.map(e=>e.order))+1;await patchExercise(v,{active:true,suggested:false,group:g,order});toast(`Added to ${GNAME(g)}`)}
  else if(a==="pedit"){S.pedit=v;render();const i=$("#pe-name");i&&i.focus()}
  else if(a==="peditcancel"){S.pedit=null;render()}
  else if(a==="move"){
    const ex=exById(v);const sib=S.exercises.filter(e=>e.group===ex.group&&e.active).sort((x,y)=>x.order-y.order);
    const i=sib.findIndex(e=>e.id===v),j=i+(+b.dataset.d);if(j<0||j>=sib.length)return;
    const o1=sib[i].order,o2=sib[j].order;
    await writeExercises(S.exercises.map(e=>e.id===sib[i].id?{...e,order:o2}:e.id===sib[j].id?{...e,order:o1}:e));
  }
  }catch(e){fail(e)}
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.dataset.lib){S.libq=t.value;const q=t.value.trim().toLowerCase();document.querySelectorAll("#lib [data-name]").forEach(el=>el.hidden=q&&!el.dataset.name.includes(q));return}
  const k=t.dataset.in;if(!k)return;const ctx=t.dataset.ctx;
  if(ctx==="edit"){if(k==="n")S.edit.n=t.value;else if(k==="d")S.edit.d=t.value;else{const r=S.edit.rows[+t.dataset.i];if(r)r[k]=t.value}return}
  if(k==="n")S.notes[ctx]=t.value;else{const r=S.rows[ctx]&&S.rows[ctx][+t.dataset.i];if(r)r[k]=t.value}
  saveDrafts();
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="restore-file"&&t.files&&t.files[0]){const f=t.files[0];const rd=new FileReader();
    rd.onload=()=>{const r=parseBackup(String(rd.result));if(r.err){S.restore=null;toast(r.err)}else S.restore={...r,name:f.name};S.confirm=null;render()};
    rd.onerror=()=>toast("Couldn't read that file");rd.readAsText(f);return}
  if(t.dataset.clr){S.clr[t.dataset.clr]=t.value;S.confirm=null;if(S.clr.to&&S.clr.from&&S.clr.to<S.clr.from)S.clr.to=S.clr.from;render()}
});
document.addEventListener("submit",async ev=>{
  const f=ev.target;if(!f.dataset.form)return;ev.preventDefault();
  try{
    if(f.dataset.form==="new"){
      const d=readForm("nf");const er=formError(d);if(er){toast(er);return}
      const base=d.name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"ex";
      let id=base,n=2;while(exById(id))id=base+"-"+n++;
      await writeExercises([...S.exercises,{id,...d,active:true,note:"",order:Math.max(0,...S.exercises.map(e=>e.order))+1}]);toast(`Added ${d.name} to ${GNAME(d.group)}`);
    }else{
      const d=readForm("pe");const er=formError(d);if(er){toast(er);return}const id=f.dataset.v;S.pedit=null;await patchExercise(id,d);toast("Exercise updated");
    }
  }catch(e){fail(e)}
});
async function saveEx(id){
  const ex=exById(id);const r=readSets(ex,S.rows[id]||[]);if(r.err){toast(r.err);return}
  const t=todayISO();const list=(S.hist[id]||[]).slice();const i=list.findIndex(e=>e.d===t);
  const note=((S.notes[id]??(i>=0?list[i].n:""))||"").trim();
  const entry={id:i>=0?list[i].id:"e"+Date.now(),d:t,s:i>=0?list[i].s:Date.now(),g:ex.group,sets:r.sets,n:note};
  const prevBest=Math.max(0,...list.filter(e=>e.d!==t).map(e=>metricsFor(ex,e).main));
  if(i>=0)list[i]=entry;else list.push(entry);
  const need=needOf(ex),n=r.sets.length,unfinished=n<need;
  delete S.rows[id];delete S.notes[id];saveDrafts();S.open=unfinished?id:null;
  await writeHistory(id,list);
  if(unfinished){toast(`Saved ${n} of ${need} sets. Targets stay the same until all ${need} are done.`);return}
  const now=metricsFor(ex,entry).main;const sg=suggest(ex);
  toast(sg.up?`Saved. Next time move up to ${ex.kind==="weight"?fmt(sg.w)+" kg":"more load"}!`:now>prevBest&&prevBest>0?`New personal best on ${ex.name}!`:`Saved ${ex.name}`);
}

/* ---------- rest timer ---------- */
/* The bar is built once; each tick only updates the numbers. (Rebuilding it 4 times a
   second replaced the buttons mid-tap, so Stop and Close often didn't register.) */
let restEnd=0,restIv=null,wake=null,rang=false,actx=null;
function restEl(){
  const el=$("#rest");
  if(!el.firstChild)el.innerHTML=`<div role="timer" aria-live="off"><b id="rest-t"></b><span id="rest-l" style="font-size:14px"></span><button type="button" id="rest-add" data-act="restadd">+30s</button><button type="button" id="rest-stop" data-act="reststop"></button></div>`;
  return el;
}
function unlockAudio(){
  /* iPhone only allows sound that a tap has unlocked, so we set it up when you start the timer */
  try{
    if(navigator.audioSession)navigator.audioSession.type="playback";   // play even with the silent switch on (newer iPhones)
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
    const o=actx.createOscillator(),g=actx.createGain();g.gain.value=0;o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+0.01);
  }catch(e){}
}
function ring(){
  try{
    if(!actx)return;if(actx.state==="suspended")actx.resume();
    const t0=actx.currentTime;
    [0,0.35,0.7,1.4,1.75,2.1].forEach(d=>{          // two bursts of three beeps
      const o=actx.createOscillator(),g=actx.createGain();
      o.type="sine";o.frequency.value=d<1?880:1175;
      g.gain.setValueAtTime(0.0001,t0+d);g.gain.exponentialRampToValueAtTime(0.6,t0+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.25);
      o.connect(g).connect(actx.destination);o.start(t0+d);o.stop(t0+d+0.3);
    });
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}
}
function startRest(sec){
  unlockAudio();
  restEnd=Date.now()+sec*1000;rang=false;clearInterval(restIv);restIv=setInterval(tickRest,250);tickRest();
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{})}catch(e){}
}
function stopRest(){
  clearInterval(restIv);restIv=null;$("#rest").hidden=true;
  try{wake&&wake.release();wake=null}catch(e){}
}
function tickRest(){
  const el=restEl();const left=Math.round((restEnd-Date.now())/1000);const done=left<=0;
  el.hidden=false;el.classList.toggle("done",done);
  $("#rest-t").textContent=done?"Go!":`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  $("#rest-l").textContent=done?"Next set":"Rest";
  $("#rest-add").hidden=done;
  $("#rest-stop").textContent=done?"Close":"Stop";
  if(done&&!rang){rang=true;ring()}
  if(left<-30)stopRest();
}
window.addEventListener("resize",()=>{if(S.tab==="progress"&&S.pex)drawChart()});
$("#today").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
renderTabs();
})();
